# For the CI smoke test on kind: no KEDA, no Azure identity, the locally built image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: relevance-scorer}
    patch: |-
      - op: remove
        path: /spec/template/spec/tolerations
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
