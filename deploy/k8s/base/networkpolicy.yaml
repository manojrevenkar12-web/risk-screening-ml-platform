apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relevance-scorer
  namespace: screening
spec:
  podSelector:
    matchLabels: {app: relevance-scorer}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: screening}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {port: 8080, protocol: TCP}
